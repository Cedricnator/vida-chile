<div class="flex flex-row gap-6 mb-6 w-full">
  <mat-card class="flex-1 bg-gradient-to-br from-blue-50 to-indigo-50 transform transition-all duration-300 hover:scale-[1.02] hover:shadow-lg" appearance="raised">
    <div class="flex justify-center items-center p-4">
      <mat-icon 
        aria-hidden="false" 
        aria-label="Example home icon" 
        fontIcon="check_circle"
        class="material-symbols-outlined text-5xl text-blue-600"
      >check_circle</mat-icon>
    </div>
    <div class="flex flex-col justify-center items-center p-4">
       <mat-card-title class="mb-2 font-bold text-gray-700">Operativos activos</mat-card-title>
       <mat-card-content>
          <span class="text-3xl font-semibold text-blue-600">5</span>
       </mat-card-content>
    </div>
 </mat-card>

 <mat-card class="flex-1 bg-gradient-to-br from-purple-50 to-pink-50 transform transition-all duration-300 hover:scale-[1.02] hover:shadow-lg" appearance="raised">
    <div class="flex justify-center items-center p-4">
      <mat-icon 
        aria-hidden="false" 
        aria-label="Example home icon" 
        fontIcon="event"
        class="material-symbols-outlined text-5xl text-purple-600"
      >event</mat-icon>
    </div>
    <div class="flex flex-col justify-center items-center p-4">
       <mat-card-title class="mb-2 font-bold text-gray-700">Numero de Operativos</mat-card-title>
       <mat-card-content>
          <span class="text-3xl font-semibold text-purple-600">
             {{ operative$().length }}
          </span>
       </mat-card-content>
    </div>
 </mat-card>
</div>

<div class="bg-white rounded-xl shadow-md p-6">
  <div class="flex justify-between items-center mb-6">
    <h3 class="text-2xl font-bold text-gray-700">Operativos</h3>
    <button mat-raised-button color="primary" (click)="addOperative()" class="px-6 py-2 transform hover:scale-105 transition-all duration-200">Crear Operativo</button>
  </div> 
  
  <table mat-table [dataSource]="operative$()!" class="w-full">     <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef> Direccion </th>
      <td mat-cell *matCellDef="let element"> {{element.address}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="startDate">
      <th mat-header-cell *matHeaderCellDef> Fecha inicio </th>
      <td mat-cell *matCellDef="let element"> {{element.startDate | date}} </td>
    </ng-container>

    <ng-container matColumnDef="endDate">
    <th mat-header-cell *matHeaderCellDef> Fecha termino </th>
    <td mat-cell *matCellDef="let element"> {{element.endDate | date}} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let element"> 
      <div class="flex gap-2">
        <button class="material-symbols-outlined" mat-icon-button color="accent" (click)="updateOperative(element)">
          <mat-icon style="font-size: large;">edit</mat-icon>
        </button>
        <button class="material-symbols-outlined" mat-icon-button color="warn" (click)="deleteOperative(element.id)">
          <mat-icon style="font-size: large;">delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors duration-150"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                showFirstLastButtons
                class="mt-4"
                aria-label="Select page of operatives">
  </mat-paginator>
</div>
